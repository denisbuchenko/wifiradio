[package]
name = "wifiradio"
version = "0.2.0"
edition = "2021"
description = "A tiny private push-to-talk radio for two Windows PCs on the same LAN"
license = "MIT"
build = "build.rs"

[dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.2.16"
if-addrs = "0.13.4"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
getrandom = "0.2.16"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
